<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>기술 동료평가</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh; /* 모바일 브라우저 툴바를 제외한 실제 보이는 높이 */
      background-color: #ffffff;
      color: #111111;
      padding: 60px 24px;
      padding-top: max(60px, calc(60px + env(safe-area-inset-top)));
      padding-bottom: max(60px, calc(60px + env(safe-area-inset-bottom)));
      position: relative;
      overflow-x: hidden;
      user-select: none;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #666666;
    }

    /* 화면 중앙 대형 차시 영역 */
    .session-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    /* 중앙 차시 텍스트 그라데이션 */
    .session-text {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -2px;

      background: linear-gradient(
        90deg, 
        #111111 0%, 
        #111111 35%, 
        #ffffff 50%, 
        #111111 65%, 
        #111111 100%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 2.5s linear infinite;
    }

    /* 버튼 기본 스타일 */
    .btn-common {
      position: relative;
      width: 100%;
      max-width: 320px;
      padding: 18px 0;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      -webkit-touch-callout: none;

      /* 손 뗄 때 축소된 크기가 부드럽게 복구 */
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 누르고 있는 동안 축소 효과 */
    .btn-common.pressed {
      transform: scale(0.90) !important;
      transition: transform 0.08s ease-out !important;
    }

    /* 누른 지점부터 퍼지는 어두운 원 (부드럽게 어두워짐) */
    .ripple-overlay {
      position: absolute;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease-out;
    }

    .ripple-overlay.show {
      opacity: 1;
    }

    .ripple-overlay.fade-out {
      opacity: 0;
    }

    /* --- 모달 관련 스타일 --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* 모바일 브라우저 툴바를 제외한 실제 보이는 높이 */
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      width: calc(100% - 32px);
      max-width: 380px;
      margin-bottom: max(20px, calc(20px + env(safe-area-inset-bottom)));
      background-color: #ffffff;
      border-radius: 28px;
      padding: 12px 24px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid #eaeaea;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    /* --- 모달 내 요소 순차적 위로 올라옴 (Stagger Animation) --- */
    .stagger-item {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 모달 활성화 시 시간차 등장 (자식 개수에 상관없이 모두 표시) */
    .modal-overlay.active .stagger-item {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.08s;
    }
    .modal-overlay.active .stagger-item:nth-child(2) {
      transition-delay: 0.16s;
    }
    .modal-overlay.active .stagger-item:nth-child(3) {
      transition-delay: 0.24s;
    }
    .modal-overlay.active .stagger-item:nth-child(4) {
      transition-delay: 0.32s;
    }

    .modal-handle-bar {
      width: 36px;
      height: 5px;
      background-color: #e2e8f0;
      border-radius: 100px;
      margin-top: 4px;
      margin-bottom: 20px;
      cursor: grab;
      touch-action: none;
    }

    .modal-session-text {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -1px;

      background: linear-gradient(
        90deg, 
        #111111 0%, 
        #111111 35%, 
        #ffffff 50%, 
        #111111 65%, 
        #111111 100%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 2.5s linear infinite;
    }

    @keyframes shine {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .notice-text {
      color: #e11d48;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .eval-btn {
      max-width: 100%;
      border-radius: 18px;
    }

    /* 구글 스타일 양끝 둥근 스피너 */
    .loading-spinner-wrapper {
      display: none;
      width: 24px;
      height: 24px;
      animation: rotate 1.4s linear infinite;
    }

    .loading-spinner-wrapper svg circle {
      stroke: #2563eb;
      stroke-dasharray: 80;
      stroke-dashoffset: 60;
      stroke-linecap: round;
      transform-origin: center;
      animation: dash 1.4s ease-in-out infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    @keyframes dash {
      0% { stroke-dashoffset: 75; }
      50% { stroke-dashoffset: 20; transform: rotate(135deg); }
      100% { stroke-dashoffset: 75; transform: rotate(450deg); }
    }

    .btn-common.is-loading {
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
      pointer-events: none;
      transform: none !important;
    }

    .btn-common.is-loading .btn-text {
      display: none;
    }

    .btn-common.is-loading .loading-spinner-wrapper {
      display: block;
    }

    /* --- 하단 버튼 묶음 --- */
    .bottom-btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    /* 조 구성 확인하기 (작은 밝은 회색 버튼) */
    .btn-secondary {
      width: auto;
      max-width: 100%;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #666666;
      background-color: #f2f2f2;
    }

    /* 조 구성 확인 모달은 좀 더 여유있게 높이 확보 */
    #groupModalOverlay .modal-content {
      min-height: 46vh;
    }

    /* 결과가 비어있어도 확인하기 버튼이 항상 모달 맨 아래에 고정되도록 */
    #groupSearchBtn {
      margin-top: auto;
    }

    /* 조 구성 확인 입력창 (플로팅 라벨) */
    .input-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 22px;
    }

    .group-input {
      width: 100%;
      border: none;
      border-bottom: 2px solid #e2e8f0;
      background: transparent;
      text-align: left;
      font-size: 18px;
      font-weight: 600;
      color: #111111;
      padding: 22px 2px 8px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .group-input:focus {
      border-bottom-color: #2563eb;
    }

    .input-label {
      position: absolute;
      left: 2px;
      top: 22px;
      font-size: 16px;
      font-weight: 500;
      color: #999999;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .group-input:focus + .input-label,
    .group-input:not(:placeholder-shown) + .input-label {
      top: 0;
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
    }

    /* 조회 결과 영역 (부드러운 확장/축소) */
    .group-result {
      width: 100%;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 16px;
      margin-bottom: 0;
      background-color: #f7f8fa;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.3s ease,
                  padding 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-bottom 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .group-result.show {
      max-height: 600px;
      opacity: 1;
      padding: 18px 16px;
      margin-bottom: 20px;
    }

    .group-result-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
    }

    .group-result-label {
      color: #888888;
      font-weight: 600;
    }

    .group-result-value {
      color: #111111;
      font-weight: 700;
    }

    .group-result-empty {
      color: #e11d48;
      font-size: 14px;
      font-weight: 600;
    }

    .group-result-members {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      text-align: left;
      padding-top: 4px;
      border-top: 1px solid #e5e7eb;
    }

    .group-result-members .group-result-value {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
      text-align: left;
    }

    /* 조장 표시 (별 대신 그라데이션 애니메이션) */
    .member-leader {
      font-weight: 800;
      background: linear-gradient(
        90deg,
        #111111 0%,
        #111111 35%,
        #ffffff 50%,
        #111111 65%,
        #111111 100%
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 2.5s linear infinite;
    }
  </style>
</head>
<body>

  <div class="header-title">기술 동료평가</div>

  <div class="session-container">
    <div class="session-text" id="mainSessionText">- 차시</div>
  </div>

  <div class="bottom-btn-group">
    <button type="button" class="btn-common btn-secondary" id="openGroupModalBtn">
      <span class="btn-text">조 구성 확인하기</span>
    </button>

    <button type="button" class="btn-common" id="openModalBtn">
      <span class="btn-text">동료평가하기</span>
    </button>
  </div>

  <!-- 조 구성 확인 모달 -->
  <div class="modal-overlay" id="groupModalOverlay">
    <div class="modal-content">
      <div class="modal-handle-bar stagger-item"></div>
      <div class="modal-session-text stagger-item" style="font-size:28px;">조 구성 확인</div>

      <div class="input-wrap stagger-item">
        <input
          type="text"
          id="groupSearchInput"
          class="group-input"
          placeholder=" "
          autocomplete="off"
          inputmode="text"
        />
        <label for="groupSearchInput" class="input-label">번호 또는 이름을 입력하세요</label>
      </div>

      <div class="group-result stagger-item" id="groupResult"></div>

      <button type="button" class="btn-common eval-btn stagger-item" id="groupSearchBtn">
        <span class="btn-text">확인하기</span>
        <div class="loading-spinner-wrapper">
          <svg viewBox="0 0 50 50" width="24" height="24">
            <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
        </div>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <!-- 순차적 애니메이션 적용 요소 (.stagger-item) -->
      <div class="modal-handle-bar stagger-item"></div>
      <div class="modal-session-text stagger-item" id="modalSessionText">- 차시</div>
      
      <div class="notice-text stagger-item">
        반드시 학교계정으로 평가하세요!!!!<br>
        반드시 친구이름을 정확히 입력하세요!!!!<br>
        반드시 팀 번호를 정확하게 입력하세요!!!!<br>
        반드시 차시를 정확하게 입력하세요!!!!
      </div>

      <button type="button" class="btn-common eval-btn stagger-item" id="goFormBtn">
        <span class="btn-text">평가하기</span>
        <div class="loading-spinner-wrapper">
          <svg viewBox="0 0 50 50" width="24" height="24">
            <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
        </div>
      </button>
    </div>
  </div>

  <script>
    let currentSession = '1';

    // 1. value.txt 읽어오기
    fetch('value.txt')
      .then(response => {
        if (!response.ok) throw new Error('value.txt 로드 실패');
        return response.text();
      })
      .then(data => {
        const match = data.match(/count\s*=\s*(\d+)/);
        if (match && match[1]) {
          currentSession = match[1];
        }
        updateSessionUI(currentSession);
      })
      .catch(err => {
        console.error(err);
        updateSessionUI(currentSession);
      });

    function updateSessionUI(session) {
      document.getElementById('mainSessionText').innerText = `${session}차시`;
      document.getElementById('modalSessionText').innerText = `${session}차시`;
    }

    // 2. 눌림 효과(리플)와 실제 동작을 분리. Pointer Events로 마우스/터치를 하나의 경로로
    //    통일해서(빠르게 연타하거나 꾹 눌렀다 떼도) 항상 동일하게 반응하도록 함.
    //    실제 동작은 일반 <button>과 똑같이 click 이벤트에만 연결.
    function setupButtonTouchEffect(button, onReleaseAction) {
      let activeOverlay = null;

      function spawnRipple(clientX, clientY) {
        if (activeOverlay) activeOverlay.remove();

        const rect = button.getBoundingClientRect();
        const circle = document.createElement('span');
        const diameter = Math.max(rect.width, rect.height) * 2.5;
        const radius = diameter / 2;

        const x = clientX - rect.left - radius;
        const y = clientY - rect.top - radius;

        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${x}px`;
        circle.style.top = `${y}px`;
        circle.classList.add('ripple-overlay');

        button.appendChild(circle);
        activeOverlay = circle;

        requestAnimationFrame(() => {
          circle.style.transform = 'scale(1)';
          circle.classList.add('show');
        });
      }

      function clearRipple() {
        button.classList.remove('pressed');
        if (!activeOverlay) return;
        const overlayToFade = activeOverlay;
        activeOverlay = null;
        overlayToFade.classList.add('fade-out');
        setTimeout(() => overlayToFade.remove(), 400);
      }

      button.addEventListener('pointerdown', function(e) {
        button.classList.add('pressed');
        spawnRipple(e.clientX, e.clientY);
      });

      button.addEventListener('pointerup', clearRipple);
      button.addEventListener('pointercancel', clearRipple);
      button.addEventListener('pointerleave', clearRipple);

      // 실제 동작 실행: 일반 버튼처럼 click 이벤트 하나에만 연결해 항상 정확히 한 번 반응
      button.addEventListener('click', function() {
        if (onReleaseAction) onReleaseAction();
      });
    }

    // 3. 모달 상단 바를 잡고 아래로 내리면 닫히고, 좌우로는 아주 살짝만 흔들리는 드래그 제어
    function setupModalDrag(handleBar, modalOverlay) {
      const modalContent = modalOverlay.querySelector('.modal-content');
      const maxSideWobble = 6;

      let dragging = false;
      let startX = 0;
      let startY = 0;
      let dragX = 0;
      let dragY = 0;

      function getPoint(e) {
        if (e.touches && e.touches.length) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function onStart(e) {
        dragging = true;
        const p = getPoint(e);
        startX = p.x;
        startY = p.y;
        modalContent.style.transition = 'none';
        handleBar.style.cursor = 'grabbing';
      }

      function onMove(e) {
        if (!dragging) return;
        const p = getPoint(e);
        let dy = p.y - startY;
        let dx = (p.x - startX) * 0.25;

        // 위로 당기는 건 살짝만 저항감 있게 따라오도록
        if (dy < 0) dy *= 0.15;

        if (dx > maxSideWobble) dx = maxSideWobble;
        if (dx < -maxSideWobble) dx = -maxSideWobble;

        dragX = dx;
        dragY = dy;

        modalContent.style.transform = `translate(${dx}px, ${dy}px)`;
      }

      function onEnd() {
        if (!dragging) return;
        dragging = false;
        handleBar.style.cursor = 'grab';
        modalContent.style.transition = '';

        const closeThreshold = Math.min(modalContent.offsetHeight * 0.22, 130);

        if (dragY > closeThreshold) {
          modalOverlay.classList.remove('active');
        }

        modalContent.style.transform = '';
        dragX = 0;
        dragY = 0;
      }

      handleBar.addEventListener('mousedown', onStart);
      handleBar.addEventListener('touchstart', onStart, { passive: true });

      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: true });

      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    }

    const openModalBtn = document.getElementById('openModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const goFormBtn = document.getElementById('goFormBtn');

    // 모달 열기 버튼 세팅
    setupButtonTouchEffect(openModalBtn, () => {
      setTimeout(() => {
        modalOverlay.classList.add('active');
      }, 80);
    });

    // 모달 차단막 클릭 시 닫기
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // 상단 바 드래그로 닫기
    setupModalDrag(modalOverlay.querySelector('.modal-handle-bar'), modalOverlay);

    // --- 조 구성 데이터 (모둠 편성 엑셀 기준) ---
    const groupData = {
      "1조": { leader: "박정안", members: [
        { num: 8, name: "박정안", leader: true },
        { num: 22, name: "임지혁" },
        { num: 4, name: "김주형" },
        { num: 29, name: "채재율" },
        { num: 31, name: "한승헌" }
      ]},
      "2조": { leader: "이강준", members: [
        { num: 19, name: "이강준", leader: true },
        { num: 9, name: "박제연" },
        { num: 35, name: "염승준" },
        { num: 36, name: "김동하" },
        { num: 6, name: "나윤재" }
      ]},
      "3조": { leader: "백도윤", members: [
        { num: 13, name: "백도윤", leader: true },
        { num: 18, name: "우율우" },
        { num: 26, name: "정유노" },
        { num: 15, name: "양승현" },
        { num: 28, name: "조건희" }
      ]},
      "4조": { leader: "김은우", members: [
        { num: 3, name: "김은우", leader: true },
        { num: 14, name: "신재원" },
        { num: 1, name: "강민준" },
        { num: 11, name: "박태현" },
        { num: 21, name: "이휘" }
      ]},
      "5조": { leader: "정민찬", members: [
        { num: 25, name: "정민찬", leader: true },
        { num: 17, name: "오현택" },
        { num: 30, name: "최준우" },
        { num: 5, name: "김하율" },
        { num: 32, name: "황예성" }
      ]},
      "6조": { leader: "김시완", members: [
        { num: 2, name: "김시완", leader: true },
        { num: 7, name: "박규민" },
        { num: 23, name: "전도윤" },
        { num: 16, name: "오유준" }
      ]},
      "7조": { leader: "정규환", members: [
        { num: 24, name: "정규환", leader: true },
        { num: 12, name: "배성원" },
        { num: 20, name: "이시형" },
        { num: 27, name: "정하율" }
      ]}
    };

    function findGroupMatches(query) {
      const q = query.trim();
      if (!q) return [];
      const isNumber = /^\d+$/.test(q);
      const matches = [];
      Object.keys(groupData).forEach(groupName => {
        groupData[groupName].members.forEach(m => {
          const hit = isNumber ? (String(m.num) === q) : (m.name === q);
          if (hit) {
            matches.push({ groupName, num: m.num, name: m.name, leaderName: groupData[groupName].leader });
          }
        });
      });
      return matches;
    }

    function renderGroupResult(matches) {
      const resultEl = document.getElementById('groupResult');

      if (matches.length === 0) {
        resultEl.innerHTML = '<div class="group-result-empty">일치하는 번호 또는 이름이 없습니다.<br>다시 확인해주세요.</div>';
        resultEl.classList.add('show');
        return;
      }

      resultEl.innerHTML = matches.map(m => {
        const teamMembers = groupData[m.groupName].members
          .map(mem => mem.leader
            ? `<span class="member-leader">${mem.num}번 ${mem.name}</span>`
            : `${mem.num}번 ${mem.name}`)
          .join(', ');

        return `
        <div style="${matches.length > 1 ? 'padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #e5e7eb;' : ''}">
          <div class="group-result-row">
            <span class="group-result-label">이름</span>
            <span class="group-result-value">${m.num}번 ${m.name}</span>
          </div>
          <div class="group-result-row">
            <span class="group-result-label">소속 모둠</span>
            <span class="group-result-value">${m.groupName}</span>
          </div>
          <div class="group-result-row">
            <span class="group-result-label">모둠장</span>
            <span class="group-result-value member-leader">${m.leaderName}</span>
          </div>
          <div class="group-result-members">
            <span class="group-result-label">모둠원</span>
            <span class="group-result-value">${teamMembers}</span>
          </div>
        </div>
      `;
      }).join('');

      resultEl.classList.add('show');
    }

    const openGroupModalBtn = document.getElementById('openGroupModalBtn');
    const groupModalOverlay = document.getElementById('groupModalOverlay');
    const groupSearchBtn = document.getElementById('groupSearchBtn');
    const groupSearchInput = document.getElementById('groupSearchInput');
    const groupResult = document.getElementById('groupResult');

    // 조 구성 확인 모달 열기
    setupButtonTouchEffect(openGroupModalBtn, () => {
      setTimeout(() => {
        groupModalOverlay.classList.add('active');
        groupResult.classList.remove('show');
        groupSearchInput.value = '';
      }, 80);
    });

    // 조 구성 확인 모달 차단막 클릭 시 닫기
    groupModalOverlay.addEventListener('click', function(e) {
      if (e.target === groupModalOverlay) {
        groupModalOverlay.classList.remove('active');
      }
    });

    // 상단 바 드래그로 닫기
    setupModalDrag(groupModalOverlay.querySelector('.modal-handle-bar'), groupModalOverlay);

    // 조 구성 조회하기 (확인하기 버튼 또는 엔터를 눌렀을 때만 결과 표시)
    function runGroupSearch() {
      const matches = findGroupMatches(groupSearchInput.value);
      renderGroupResult(matches);
    }

    setupButtonTouchEffect(groupSearchBtn, runGroupSearch);

    groupSearchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        runGroupSearch();
      }
    });

    // 최종 평가하기 버튼 세팅 (구글폼 이동)
    setupButtonTouchEffect(goFormBtn, () => {
      setTimeout(() => {
        goFormBtn.classList.add('is-loading');

        const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSe8mHBFBRI-KRre8SRy9dl1h2NnTe1af9YzGtBiZI2toO1XCw/viewform";
        const params = new URLSearchParams();
        params.append('entry.333333333', currentSession); // 사용 구글폼의 차시 entry ID 입력

        setTimeout(() => {
          window.location.href = `${baseUrl}?${params.toString()}`;
        }, 400);
      }, 80);
    });
  </script>

</body>
</html>
